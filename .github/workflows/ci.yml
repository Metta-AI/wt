# CI for the public Metta-AI/wt mirror. In the Softmax monorepo this file is
# inert (GitHub only runs workflows from the repo root); Copybara moves it to
# .github/workflows/ci.yml in the mirror.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --extra test pytest -v
